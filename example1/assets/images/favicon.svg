<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="20" fill="#0d0e12"/>
  <circle cx="50" cy="50" r="38" fill="none" stroke="#d4af37" stroke-width="4"/>
  <circle cx="50" cy="50" r="28" fill="none" stroke="#e5c158" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- Camera lens center with V -->
  <circle cx="50" cy="50" r="18" fill="url(#goldGradient)"/>
  <text x="50" y="58" font-family="'Cinzel', serif" font-size="22" font-weight="bold" fill="#0d0e12" text-anchor="middle">V</text>
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff" />
      <stop offset="50%" stop-color="#f3e5ab" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
  </defs>
</svg>
